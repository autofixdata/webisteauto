name: Lighthouse audit

on:
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Start server and wait
        run: |
          npm run start &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:3000/en >/dev/null; then
              echo "Server ready"
              exit 0
            fi
            sleep 2
          done
          echo "Server failed to start"
          exit 1

      - name: Run Lighthouse (home + DTC)
        run: |
          npx --yes lighthouse http://127.0.0.1:3000/en --only-categories=performance,seo,best-practices --preset=desktop --chrome-flags="--headless --no-sandbox" --output=json --output-path=lighthouse-en.json
          npx --yes lighthouse http://127.0.0.1:3000/en/dtc --only-categories=performance,seo,best-practices --preset=desktop --chrome-flags="--headless --no-sandbox" --output=json --output-path=lighthouse-dtc.json

      - uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: lighthouse-*.json
